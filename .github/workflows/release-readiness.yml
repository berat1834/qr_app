name: Release Readiness

on:
  push:
    branches: [ release-readiness-fixes ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        if: always()
        run: flutter test --reporter expanded

  emulator-smoke:
    name: Emulator smoke test (install + launch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write smoke script
        run: |
          cat > smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          PKG=com.qrscanner.professional
          adb install -r build/app/outputs/flutter-apk/app-debug.apk || exit 1
          adb shell pm grant $PKG android.permission.CAMERA || true
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
          sleep 40
          adb logcat -d > logcat.txt
          adb shell screencap -p /sdcard/smoke.png && adb pull /sdcard/smoke.png smoke.png || true
          if ! adb shell pidof $PKG; then
            echo "::error::App process is not running after launch (crash?)"
            grep -A 30 "FATAL EXCEPTION" logcat.txt || true
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" logcat.txt; then
            echo "::error::FATAL EXCEPTION found in logcat"
            grep -A 30 "FATAL EXCEPTION" logcat.txt
            exit 1
          fi
          echo "Flutter errors (if any):"
          grep -iE "flutter.*(error|exception)" logcat.txt | head -50 || true
          echo "SMOKE TEST PASSED: app launched and stayed alive for 40s"
          EOF
          chmod +x smoke.sh
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: ./smoke.sh
      - name: Upload logcat + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            logcat.txt
            smoke.png
          if-no-files-found: ignore

  build-aab:
    name: Release AAB build (CI throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create throwaway signing key (NOT for Play upload)
        run: |
          keytool -genkeypair -v -keystore android/app/ci-throwaway.jks -storepass cipass123 -keypass cipass123 \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI, O=CI, C=TR"
          printf 'storePassword=cipass123\nkeyPassword=cipass123\nkeyAlias=ci\nstoreFile=ci-throwaway.jks\n' > android/key.properties
      - name: Build AAB
        run: flutter build appbundle --release
      - name: AAB size
        run: ls -lh build/app/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-ci-signed
          path: build/app/outputs/bundle/release/app-release.aab
